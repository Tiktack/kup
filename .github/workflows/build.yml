name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Publish ${{ matrix.rid }} (Native AOT)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            artifact: kup-win-x64
            asset: kup.exe
          - runner: macos-15
            rid: osx-arm64
            artifact: kup-osx-arm64
            asset: kup-osx-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/KupReport -r ${{ matrix.rid }}

      - name: Publish
        run: dotnet publish src/KupReport -c Release -r ${{ matrix.rid }} --no-restore

      - name: Stage artifact
        shell: pwsh
        run: |
          $publish = Join-Path "src/KupReport/bin/Release/net10.0" "${{ matrix.rid }}/publish"
          New-Item -ItemType Directory -Force artifacts | Out-Null

          if ("${{ runner.os }}" -eq "Windows") {
            Copy-Item (Join-Path $publish "kup.exe") (Join-Path artifacts "${{ matrix.asset }}")
          }
          else {
            tar -czf (Join-Path artifacts "${{ matrix.asset }}") -C $publish kup
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kup-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
